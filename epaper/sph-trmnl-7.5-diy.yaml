# Maxim ePaper Display - v30.9 - Child Entity Substitutions
# Stable event-driven refresh architecture with partial refresh
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

# ---------------------------------------------------------------------------
# Child-specific Home Assistant entity IDs
# Change these two values only when this display is assigned to another child.
# Values must match the lowercase fragments used in Home Assistant entity IDs.
# ---------------------------------------------------------------------------
substitutions:
  child_name: maxim
  child_short: mk
esphome:
  name: maxim-epaper
  friendly_name: Maxim ePaper Display
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
        
esp32:
  variant: esp32s3
  framework:
    type: arduino
logger:
  level: DEBUG
  logs:
    homeassistant.text_sensor: WARN
    homeassistant.sensor: WARN
    api: INFO
    api.connection: INFO

psram:
  mode: octal
  speed: 80MHz
  
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: XIAO Fallback Hotspot
    password: !secret fallback_ap_password

captive_portal:

  
# ESPHome JSON support. ArduinoJson is provided by ESPHome itself.
json:


# V29: Page changes use the normal partial-refresh cycle for maximum speed.
# Every 12th refresh remains a normal full refresh to limit accumulated ghosting.

